<!doctype html><html><head><meta charset="utf-8"><base href="/"><title>Terrain bench</title>
<!-- Terrain benchmark: flies the camera straight over a real-world theater and measures frame times, the stutters while
     streamed elevation and imagery arrive, and which imagery services delivered tiles. Serve the project (npm start)
     and open e.g.
       /tools/terrain-bench.html?t=uswest&lat=37.74&lon=-119.6&agl=600&hdg=90&speed=220&dur=90
     speed in m/s (0 hovers), dur in s, settle=s to wait for the ground before the clock starts. When done the result
     is in window.result_ and printed on the page. -->
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/examples/jsm/": "/node_modules/three/examples/jsm/" } }</script>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;background:#0008;padding:6px;white-space:pre}</style></head>
<body><canvas id="c"></canvas><div id="hud"></div>
<script type="module">
import * as THREE from 'three';
import { SceneRenderer } from '/build/src/render/scene.js';
import { ensureTheater, setTheater, currentTheater, terrainHeight } from '/build/src/world/theater.js';
const q = new URLSearchParams(location.search);
const th = q.get('t') ?? 'uswest', lat = +(q.get('lat') ?? 37.74), lon = +(q.get('lon') ?? -119.6);
const agl = +(q.get('agl') ?? 600), hdg = +(q.get('hdg') ?? 90) * Math.PI / 180, pitch = +(q.get('pitch') ?? -10) * Math.PI / 180;
const speed = +(q.get('speed') ?? 220), dur = +(q.get('dur') ?? 90), settle = +(q.get('settle') ?? 0);
await ensureTheater(th);
setTheater(th);
const c = document.getElementById('c');
c.width = innerWidth; c.height = innerHeight;
const s = new SceneRenderer(c); window.__scene = s;
s.resize(innerWidth, innerHeight);
s.setWeather({ visibilityKm: 80, clouds: 'clear', cloudBase: 3000, timeOfDay: +(q.get('tod') ?? 14) });
s.reset();
const T = currentTheater();
const p0 = (await import('/build/src/world/theaters/' + th + '.js'))[th + 'Lcc'].forward(lat, lon);
const gl = s.renderer.getContext(), dbg = gl.getExtension('WEBGL_debug_renderer_info');
const gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
const dir = new THREE.Vector3(Math.sin(hdg), 0, -Math.cos(hdg));
const look = new THREE.Vector3(Math.sin(hdg) * Math.cos(pitch), Math.sin(pitch), -Math.cos(hdg) * Math.cos(pitch));
const dts = [], cpu = [];
let start = null, last = performance.now(), y = null;
const pos = new THREE.Vector3();
const hud = document.getElementById('hud');
function pct(a, f) { const b = [...a].sort((x, y) => x - y); return b[Math.min(b.length - 1, Math.floor(b.length * f))]; }
function frame(now) {
  const t0 = performance.now();
  if (start === null && now / 1000 >= settle) start = now;
  const t = start === null ? 0 : (now - start) / 1000;
  pos.set(p0.x, 0, p0.z).addScaledVector(dir, speed * t);
  // follow the ground loosely (a jet holding its height above the terrain, not every bump)
  const g = Math.max(0, terrainHeight(pos.x, pos.z)) + agl;
  y = y === null ? g : y + (g - y) * Math.min(1, (now - last) / 1000 * 0.5);
  pos.y = Math.max(y, Math.max(0, terrainHeight(pos.x, pos.z)) + 60);
  s.renderView(pos, pos.clone().add(look));
  const t1 = performance.now();
  if (start !== null) { dts.push(now - last); cpu.push(t1 - t0); }
  last = now;
  window.cells_ = T.stream?.loaded ?? -1;
  if ((dts.length % 30) === 1) hud.textContent = `${gpu}\nt ${t.toFixed(0)} s  fps ${(1000 / (dts.slice(-30).reduce((a, b) => a + b, 0) / Math.min(30, dts.length))).toFixed(0)}  cells ${window.cells_}\n${JSON.stringify(s.terrain.imagery.stats())}`;
  if (start !== null && t >= dur) {
    const sum = dts.reduce((a, b) => a + b, 0);
    window.result_ = {
      gpu, theater: th, lat, lon, agl, speed, dur, size: [innerWidth, innerHeight], pixelRatio: s.renderer.getPixelRatio(),
      frames: dts.length, fpsAvg: +(1000 * dts.length / sum).toFixed(1),
      frameMs: { p50: +pct(dts, 0.5).toFixed(1), p95: +pct(dts, 0.95).toFixed(1), p99: +pct(dts, 0.99).toFixed(1), max: +Math.max(...dts).toFixed(1) },
      cpuMs: { p50: +pct(cpu, 0.5).toFixed(1), p99: +pct(cpu, 0.99).toFixed(1), max: +Math.max(...cpu).toFixed(1) },
      hitches: { over33: dts.filter((d) => d > 33.4).length, over50: dts.filter((d) => d > 50).length, over100: dts.filter((d) => d > 100).length },
      cells: window.cells_, imagery: s.terrain.imagery.stats(), drawCalls: s.renderer.info.render.calls, triangles: s.renderer.info.render.triangles,
    };
    hud.textContent = JSON.stringify(window.result_, null, 1);
    return;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
